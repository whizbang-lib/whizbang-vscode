name: Package

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'media/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/package.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'media/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/package.yml'

jobs:
  package:
    name: Create VSIX
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup Node.js
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
      with:
        node-version: '20.x'

    - name: Setup pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      with:
        version: 9

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Create VSIX package
      run: pnpm run package

    - name: Get package version
      id: package-version
      run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

    - name: Upload VSIX artifact
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: whizbang-${{ steps.package-version.outputs.version }}
        path: '*.vsix'
        retention-days: 30

    - name: Verify VSIX
      run: |
        if [ ! -f whizbang-${{ steps.package-version.outputs.version }}.vsix ]; then
          echo "Error: VSIX file not created"
          exit 1
        fi
        echo "✓ VSIX package created successfully: whizbang-${{ steps.package-version.outputs.version }}.vsix"
