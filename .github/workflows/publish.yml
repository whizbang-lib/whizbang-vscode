name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to Marketplace
    runs-on: ubuntu-latest
    environment: vscode-publish
    outputs:
      version: ${{ steps.package-version.outputs.version }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Setup Node.js
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
      with:
        node-version: '20.x'

    - name: Setup pnpm
      uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
      with:
        version: 9

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Compile extension
      run: pnpm run vscode:prepublish

    - name: Get package version
      id: package-version
      run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

    - name: Create VSIX package
      run: pnpm run package

    - name: Publish to VS Code Marketplace
      run: |
        npx @vscode/vsce publish --pat ${{ secrets.VSCE_PAT }}
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.2.1
      with:
        files: '*.vsix'
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(steps.package-version.outputs.version, '-') }}

    - name: Upload VSIX to Release
      run: |
        echo "✓ Extension published to VS Code Marketplace"
        echo "✓ VSIX uploaded to GitHub Release"
        echo "Version: ${{ steps.package-version.outputs.version }}"

  notify:
    name: Notify Publish Status
    needs: publish
    if: always()
    uses: ./.github/workflows/notify-build-status.yml
    with:
      status: ${{ needs.publish.result == 'success' && 'deployed' || 'deploy-failed' }}
      title: "[VSCODE] Extension v${{ needs.publish.outputs.version }} Published"
      message: "Whizbang VSCode extension published to Marketplace"
    secrets:
      PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
      PUSHOVER_USER_KEY_1: ${{ secrets.PUSHOVER_USER_KEY_1 }}
